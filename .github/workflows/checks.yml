name: Check and compile
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Native animation and recovery-tool checks
        run: make check
      - name: Verify generated preview is current
        run: git diff --exit-code -- preview/frames.js
      - name: Install pinned toolchain and vendor display driver
        run: python3 tools/project.py setup
      - name: Compile for Waveshare ESP32-S3 Touch AMOLED 1.75
        run: python3 tools/project.py build
